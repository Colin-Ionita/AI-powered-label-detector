server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 1024MB

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  batch:
    max-size: ${MAX_BATCH_SIZE:300}
    worker-concurrency: ${WORKER_CONCURRENCY:4}
    retention-ms: ${BATCH_RETENTION_MS:3600000}
    cleanup-rate-ms: ${BATCH_CLEANUP_RATE_MS:600000}
  ocr:
    provider: ${OCR_PROVIDER:mock}
    google-vision:
      api-key: ${GOOGLE_VISION_API_KEY:}
      endpoint: ${GOOGLE_VISION_ENDPOINT:https://vision.googleapis.com/v1/images:annotate}
      timeout-ms: ${OCR_TIMEOUT_MS:10000}
  warning:
    require-bold-metadata: ${REQUIRE_WARNING_BOLD_METADATA:false}
